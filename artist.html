<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#F1ECDA" />
    <title>ArtMarks</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-type="artist">
    <header>
      <button id="lang" class="l">EN</button><img src="logo-teal.png" alt="بصمات فن" />
    </header>
    <main>
      <div class="panel">
        <h1 id="ttl"></h1>
        <p class="sub" id="evn"></p>
        <section id="s1">
          <label data-i="name"></label><input id="nm" autocomplete="name" />
          <label data-i="phone"></label><input id="ph" type="tel" autocomplete="tel" />
          <label data-i="email"></label><input id="em" type="email" autocomplete="email" />
          <label data-i="acode"></label
          ><input id="ac" autocomplete="off" autocapitalize="characters" />
          <div class="err" id="e1"></div>
          <button class="btn" id="go" data-i="send"></button>
        </section>
        <section id="s2" class="hide">
          <p class="sub" id="sent"></p>
          <label data-i="code"></label
          ><input id="code" inputmode="numeric" maxlength="8" autocomplete="one-time-code" />
          <div class="err" id="e2"></div>
          <button class="btn" id="vf" data-i="verify"></button>
        </section>
        <section id="s3" class="hide">
          <canvas id="cv"></canvas>
          <button class="btn" id="dl" data-i="dl"></button>
          <button class="btn l" id="sh" data-i="share"></button>
          <button class="btn l" id="ml" data-i="mail"></button>
          <div class="ok" id="mm"></div>
          <div class="err" id="e3"></div>
          <p class="sub" data-i="hint" style="margin-top: 10px"></p>
          <button class="btn l" id="nw" data-i="again"></button>
        </section>
      </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
    <script src="config.js"></script>
    <script src="common.js"></script>
    <script src="register.js"></script>
  </body>
</html>
